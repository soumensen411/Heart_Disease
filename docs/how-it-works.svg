<rect x="680" y="284" width="160" height="88" rx="6" fill="rgba(180,48,31,.08)" stroke="#b4301f" stroke-width="1.5"/>
<rect x="692" y="296" width="42" height="14" rx="2" fill="none" stroke="#b4301f" stroke-opacity=".6" stroke-width="1"/>
<text x="713.0" y="306" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="8" letter-spacing=".9" fill="#b4301f">MODEL</text>
<text x="692" y="330" font-family="'Geist','Instrument Sans','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#b4301f">KNN · k = 5</text>
<text x="692" y="346" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="10" fill="#5b5853">5 closest patients</text>
