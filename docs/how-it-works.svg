<rect x="304" y="56" width="160" height="88" rx="6" fill="#ffffff" stroke="#1b1a19" stroke-width="1.25"/>
<rect x="316" y="68" width="49" height="14" rx="2" fill="none" stroke="#5b5853" stroke-opacity=".6" stroke-width="1"/>
<text x="340.5" y="78" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="8" letter-spacing=".9" fill="#5b5853">SCRIPT</text>
<text x="316" y="102" font-family="'Geist','Instrument Sans','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1b1a19">train.py</text>
<text x="316" y="118" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="10" fill="#5b5853">5-fold CV for metrics</text>
<text x="316" y="132" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="10" fill="#5b5853">then fit on all rows</text>
<rect x="572" y="56" width="160" height="88" rx="6" fill="#f4f3f1"/>
<rect x="572" y="56" width="160" height="88" rx="6" fill="#ffffff" stroke="#76726c" stroke-width="1"/>
<rect x="584" y="68" width="36" height="14" rx="2" fill="none" stroke="#5b5853" stroke-opacity=".6" stroke-width="1"/>
<text x="602.0" y="78" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="8" letter-spacing=".9" fill="#5b5853">FILE</text>
<text x="584" y="102" font-family="'Geist','Instrument Sans','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1b1a19">heart_model.pkl</text>
<text x="584" y="118" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="10" fill="#5b5853">one saved Pipeline:</text>
<text x="584" y="132" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="10" fill="#5b5853">prep + KNN together</text>
<rect x="32" y="284" width="160" height="88" rx="6" fill="#f4f3f1"/>
<rect x="32" y="284" width="160" height="88" rx="6" fill="rgba(27,26,25,.07)" stroke="#5b5853" stroke-width="1"/>
<rect x="44" y="296" width="42" height="14" rx="2" fill="none" stroke="#5b5853" stroke-opacity=".6" stroke-width="1"/>
<text x="65.0" y="306" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="8" letter-spacing=".9" fill="#5b5853">INPUT</text>
<text x="44" y="330" font-family="'Geist','Instrument Sans','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1b1a19">Patient data</text>
<text x="44" y="346" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="10" fill="#5b5853">11 clinical values</text>
<text x="44" y="360" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="10" fill="#5b5853">or a CSV upload</text>
<rect x="248" y="284" width="160" height="88" rx="6" fill="#f4f3f1"/>
<rect x="248" y="284" width="160" height="88" rx="6" fill="#ffffff" stroke="#1b1a19" stroke-width="1.25"/>
<rect x="260" y="296" width="30" height="14" rx="2" fill="none" stroke="#5b5853" stroke-opacity=".6" stroke-width="1"/>
<text x="275.0" y="306" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="8" letter-spacing=".9" fill="#5b5853">APP</text>
<text x="260" y="330" font-family="'Geist','Instrument Sans','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1b1a19">Web app</text>
<text x="260" y="346" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="10" fill="#5b5853">server.py or app.py</text>
<text x="260" y="360" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="10" fill="#5b5853">validates the input</text>
<rect x="464" y="284" width="160" height="88" rx="6" fill="#f4f3f1"/>
<rect x="464" y="284" width="160" height="88" rx="6" fill="#ffffff" stroke="#1b1a19" stroke-width="1.25"/>
<rect x="476" y="296" width="36" height="14" rx="2" fill="none" stroke="#5b5853" stroke-opacity=".6" stroke-width="1"/>
<text x="494.0" y="306" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="8" letter-spacing=".9" fill="#5b5853">STEP</text>
<text x="476" y="330" font-family="'Geist','Instrument Sans','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1b1a19">Preprocess</text>
<text x="476" y="346" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="10" fill="#5b5853">fix zeros, fill gaps,</text>
<text x="476" y="360" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="10" fill="#5b5853">scale, one-hot encode</text>
