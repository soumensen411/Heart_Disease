<svg id="how-it-works" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 464" width="1088" height="464" role="img" aria-labelledby="how-it-works-title how-it-works-desc">
<title id="how-it-works-title">How the heart disease predictor works</title>
<desc id="how-it-works-desc">A model is trained once from heart.csv and saved as one pipeline file; each prediction then runs patient data through the web app, preprocessing and a 5-neighbor KNN to produce a risk report.</desc>
<defs>
