<rect x="896" y="284" width="160" height="88" rx="6" fill="rgba(27,26,25,.07)" stroke="#5b5853" stroke-width="1"/>
<rect x="908" y="296" width="49" height="14" rx="2" fill="none" stroke="#5b5853" stroke-opacity=".6" stroke-width="1"/>
<text x="932.5" y="306" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="8" letter-spacing=".9" fill="#5b5853">OUTPUT</text>
<text x="908" y="330" font-family="'Geist','Instrument Sans','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1b1a19">Risk report</text>
<text x="908" y="346" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="10" fill="#5b5853">risk %, confidence,</text>
