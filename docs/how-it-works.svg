<text x="62.0" y="78" text-anchor="middle" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="8" letter-spacing=".9" fill="#5b5853">DATA</text>
<text x="44" y="102" font-family="'Geist','Instrument Sans','Inter',ui-sans-serif,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#1b1a19">heart.csv</text>
<text x="44" y="118" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="10" fill="#5b5853">918 patients</text>
<text x="44" y="132" font-family="'Geist Mono',ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="10" fill="#5b5853">11 inputs + outcome</text>
